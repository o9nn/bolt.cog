name: Electron desktop release

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/electron-release.yml'
      - 'docs/ELECTRON_RELEASE.md'
  push:
    branches:
      - feat/electron-desktop-release
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/electron-release.yml'
      - 'docs/ELECTRON_RELEASE.md'
  workflow_dispatch:

# Packaging never receives a write token or signing secrets.
permissions:
  contents: read

concurrency:
  group: electron-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extensions: AppImage,deb
          - runner: ubuntu-24.04
            platform: linux
            arch: arm64
            extensions: AppImage,deb
          - runner: windows-2022
            platform: win
            arch: x64
            extensions: exe
          - runner: macos-14
            platform: mac
            arch: x64
            extensions: dmg,zip
          - runner: macos-14
            platform: mac
            arch: arm64
            extensions: dmg,zip
    defaults:
      run:
        shell: bash
    env:
      # Stable v26: skip certificate discovery; no certificate secrets are passed.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate desktop identity and dependency pins
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./desktop/package.json');
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          assert.equal(pkg.name, 'bolt-cog-desktop');
          assert.ok(semver.test(pkg.version), 'Desktop version must be SemVer');
          assert.equal(pkg.packageManager, 'pnpm@9.4.0');
          assert.equal(pkg.devDependencies.electron, '45.3.2');
          assert.equal(pkg.devDependencies['electron-builder'], '26.18.0');
          assert.equal(pkg.engines.node, '>=22.12.0');
          const [major, minor] = process.versions.node.split('.').map(Number);
          assert.ok(major > 22 || (major === 22 && minor >= 12));
          const ref = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF.startsWith('refs/tags/desktop-v')) {
            assert.ok(semver.test(ref.slice('desktop-v'.length)), 'Release tag must be SemVer');
            assert.equal(ref, `desktop-v${pkg.version}`, 'Tag must match desktop/package.json');
          }
          NODE

      - name: Check release tag with shared version validator
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node desktop/scripts/check-version.cjs

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.4.0
          package_json_file: desktop/package.json
          run_install: false

      - name: Install Linux native and display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libgtk-3-0t64 libnss3 libgbm1 libxss1 libx11-xcb1 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxtst6 libfuse2t64

      - name: Install only desktop dependencies
        run: |
          test "$(pnpm --version)" = '9.4.0'
          pnpm --dir desktop install --frozen-lockfile

      - name: Verify installed tool versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(require('./desktop/node_modules/electron/package.json').version, '45.3.2');
          assert.equal(require('./desktop/node_modules/electron-builder/package.json').version, '26.18.0');
          NODE

      - name: Test desktop security policy
        run: pnpm --dir desktop test

      - name: Package installers without publishing
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          # exec passes arguments directly; there is no extra "--" separator.
          pnpm --dir desktop exec electron-builder \
            "--${BUILD_PLATFORM}" "--${BUILD_ARCH}" --publish never

      - name: Configure packaged Linux sandbox helper
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          # Only this ephemeral runner's packaged helper gets setuid ownership.
          helper="$PWD/desktop/dist/linux-unpacked/chrome-sandbox"
          test -f "$helper" && test ! -L "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%U:%G:%a' "$helper")" = 'root:root:4755'

      - name: Smoke test the real packaged Linux x64 application
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          export BOLT_DESKTOP_SMOKE_BINARY="$PWD/desktop/dist/linux-unpacked/bolt-cog-desktop"
          test -x "$BOLT_DESKTOP_SMOKE_BINARY"
          xvfb-run -a --server-args='-screen 0 1280x800x24' pnpm --dir desktop smoke

      - name: Require every installer target
        env:
          EXPECTED_EXTENSIONS: ${{ matrix.extensions }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'desktop/dist';
          const files = fs.readdirSync(dir, { withFileTypes: true }).filter(f => f.isFile());
          for (const ext of process.env.EXPECTED_EXTENSIONS.split(',')) {
            const matches = files.filter(f => f.name.endsWith(`.${ext}`));
            assert.ok(matches.length, `Missing required .${ext} installer`);
            for (const file of matches) {
              assert.ok(fs.statSync(path.join(dir, file.name)).size > 0, `Empty installer: ${file.name}`);
              console.log(`Installer: ${file.name}`);
            }
          }
          NODE

      - name: Upload installers only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft-release:
    name: Assemble draft release
    needs: build
    # Manual dispatch, including dispatch on a tag, is deliberately artifact-only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Revalidate tag and version before release writes
        run: node desktop/scripts/check-version.cjs

      - name: Download this run's installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: downloaded
          merge-multiple: false

      - name: Gather actual installers and compute SHA256SUMS
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const groups = {
            'desktop-linux-x64': ['AppImage', 'deb'],
            'desktop-linux-arm64': ['AppImage', 'deb'],
            'desktop-win-x64': ['exe'],
            'desktop-mac-x64': ['dmg', 'zip'],
            'desktop-mac-arm64': ['dmg', 'zip'],
          };
          fs.mkdirSync('release-assets');
          const names = new Set();
          const sums = [];
          for (const [group, extensions] of Object.entries(groups)) {
            const dir = path.join('downloaded', group);
            const files = fs.readdirSync(dir, { withFileTypes: true });
            for (const ext of extensions) {
              assert.ok(files.some(f => f.isFile() && f.name.endsWith(`.${ext}`)), `${group}: missing .${ext}`);
            }
            for (const file of files) {
              assert.ok(file.isFile(), `Unexpected unpacked directory in ${group}`);
              assert.ok(extensions.some(ext => file.name.endsWith(`.${ext}`)), `Unexpected file: ${file.name}`);
              assert.ok(/^[A-Za-z0-9][A-Za-z0-9._ -]*$/.test(file.name), `Unsafe filename: ${file.name}`);
              assert.ok(!names.has(file.name), `Duplicate asset name: ${file.name}; include OS and architecture in artifactName`);
              names.add(file.name);
              const source = path.join(dir, file.name);
              assert.ok(fs.statSync(source).size > 0, `Empty installer: ${file.name}`);
              fs.copyFileSync(source, path.join('release-assets', file.name));
              const hash = crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex');
              sums.push(`${hash}  ${file.name}`);
            }
          }
          fs.writeFileSync('release-assets/SHA256SUMS', sums.sort().join('\n') + '\n');
          NODE
          (cd release-assets && sha256sum --check SHA256SUMS)
          cat > release-notes.md <<'NOTES'
          Maintainer preview of Bolt Cog Desktop. These installers are unsigned and macOS builds are not notarized. They are not approved production distribution builds.

          The desktop shell loads https://bolt-cog.pages.dev and authenticates through https://rzo.cloudflareaccess.com. Network access is required; the offline screen is an error/retry UI, not an offline workspace. No preload, IPC bridge, or host command execution is provided.

          Verify each downloaded installer against SHA256SUMS. Review platform launch tests, security policy, production signing and macOS notarization before any manual publication. This workflow never publishes the draft automatically.
          NOTES

      - name: Create or update draft only, then verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A failed list/read is fatal; do not treat authentication errors as absence.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          state="$(node <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8')).flat();
          const release = releases.find(r => r.tag_name === process.env.RELEASE_TAG);
          console.log(!release ? 'absent' : release.draft ? 'draft' : 'published');
          NODE
          )"
          case "$state" in
            absent)
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Bolt Cog Desktop ${RELEASE_TAG#desktop-v}" --notes-file release-notes.md
              ;;
            draft)
              # Preserve maintainer-edited notes on reruns.
              gh release edit "$RELEASE_TAG" --verify-tag --draft \
                --title "Bolt Cog Desktop ${RELEASE_TAG#desktop-v}"
              ;;
            *)
              echo 'Refusing to modify an already published release.' >&2
              exit 1
              ;;
          esac
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = 'true'
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json isDraft,tagName,assets > release-readback.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const release = JSON.parse(fs.readFileSync('release-readback.json', 'utf8'));
          assert.equal(release.isDraft, true, 'Release must remain a draft');
          assert.equal(release.tagName, process.env.RELEASE_TAG);
          for (const name of fs.readdirSync('release-assets')) {
            const asset = release.assets.find(a => a.name === name);
            assert.ok(asset, `Missing uploaded asset: ${name}`);
            assert.equal(asset.size, fs.statSync(path.join('release-assets', name)).size, `Wrong asset size: ${name}`);
          }
          NODE
