name: C edition desktop release

on:
  push:
    tags:
      - 'c-desktop-v*'
  workflow_dispatch:

# No PR packaging duplicate; dispatch (even on a tag) is artifact-only.
# Build jobs have no release write token, signing secrets or persisted Git credentials.
permissions:
  contents: read

concurrency:
  group: c-edition-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package C edition ${{ matrix.platform }} ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/c-desktop-v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extensions: AppImage,deb
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            extensions: AppImage,deb
          - runner: windows-2022
            platform: win
            arch: x64
            extensions: exe
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extensions: dmg,zip
          - runner: macos-15
            platform: mac
            arch: arm64
            extensions: dmg,zip
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate C edition identity, pins and tag
        id: identity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = require('./desktop/package.json');
          const edition = require('./desktop/c-edition.json');
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          assert.equal(pkg.name, 'bolt-cog-desktop');
          assert.equal(pkg.productName, 'Bolt Cog C');
          assert.equal(pkg.build.productName, 'Bolt Cog C');
          assert.equal(pkg.build.appId, 'org.o9nn.boltcog.c17');
          assert.equal(pkg.build.executableName, 'bolt-cog-desktop');
          assert.equal(pkg.build.artifactName, 'BoltCog-C-${version}-${os}-${arch}.${ext}');
          assert.equal(pkg.build.nsis.artifactName, 'BoltCog-C-${version}-win-${arch}-setup.${ext}');
          assert.equal(pkg.build.portable.artifactName, 'BoltCog-C-${version}-win-${arch}-portable.${ext}');
          assert.ok(semver.test(pkg.version), 'Desktop version must be SemVer');
          assert.equal(pkg.packageManager, 'pnpm@9.4.0');
          assert.equal(pkg.devDependencies.electron, '45.3.2');
          assert.equal(pkg.devDependencies['electron-builder'], '26.18.0');
          assert.equal(pkg.engines.node, '>=22.12.0');
          const [major, minor] = process.versions.node.split('.').map(Number);
          assert.ok(major > 22 || (major === 22 && minor >= 12));
          assert.equal(edition.enabled, true);
          assert.equal(edition.standard, 'c17');
          assert.match(edition.image, /^docker\.io\/library\/gcc@sha256:[a-f0-9]{64}$/);
          assert.ok(pkg.build.files.includes('c-edition.json'));
          if (process.env.GITHUB_REF.startsWith('refs/tags/')) {
            const prefix = 'c-desktop-v';
            const tag = process.env.GITHUB_REF_NAME;
            assert.ok(tag.startsWith(prefix), 'Only C edition release tags are accepted');
            assert.ok(semver.test(tag.slice(prefix.length)), 'C release tag must be SemVer');
            assert.equal(tag.slice(prefix.length), pkg.version, 'C tag must match desktop/package.json');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\nimage=${edition.image}\n`);
          NODE

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.4.0
          package_json_file: desktop/package.json
          run_install: false

      - name: Install Linux native and display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libgtk-3-0t64 libnss3 libgbm1 libxss1 libx11-xcb1 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxtst6 libfuse2t64

      - name: Install frozen application and desktop dependencies
        run: |
          test "$(pnpm --version)" = '9.4.0'
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Verify installed tool versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(require('./desktop/node_modules/electron/package.json').version, '45.3.2');
          assert.equal(require('./desktop/node_modules/electron-builder/package.json').version, '26.18.0');
          NODE

      - name: Build bundled local application runtime
        run: pnpm run build:desktop

      - name: Test application and type-check integration
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$BUILD_PLATFORM" = linux ]; then
            pnpm test
          else
            # The existing remote native-service integration is Linux-only.
            pnpm exec vitest --run --exclude app/lib/.server/native-execution.spec.ts
          fi
          pnpm typecheck

      - name: Test desktop security policy
        run: pnpm --dir desktop test

      - name: Require enforcing Linux Docker engine and pull pinned C image
        if: matrix.platform == 'linux'
        env:
          BOLT_C_DOCKER_PATH: /usr/bin/docker
          BOLT_C_DOCKER_HOST: unix:///var/run/docker.sock
          BOLT_C_IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c-edition-evidence" "$RUNNER_TEMP/c-edition-docker-config"
          test -x "$BOLT_C_DOCKER_PATH"
          test -S /var/run/docker.sock
          "$BOLT_C_DOCKER_PATH" --config "$RUNNER_TEMP/c-edition-docker-config" \
            --host "$BOLT_C_DOCKER_HOST" info --format '{{json .}}' \
            > "$RUNNER_TEMP/c-edition-evidence/docker-info.json"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const engine = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'c-edition-evidence/docker-info.json'), 'utf8'));
          assert.equal(engine.OSType, 'linux');
          for (const key of ['MemoryLimit', 'CpuCfsQuota', 'PidsLimit']) {
            assert.equal(engine[key], true, `Docker must enforce ${key}`);
          }
          assert.ok(Array.isArray(engine.SecurityOptions));
          assert.ok(engine.SecurityOptions.some(s => /^name=seccomp,profile=(builtin|default)$/.test(s)), 'Builtin seccomp must be enabled');
          // SwapLimit is enforced by the real adapter: controller support OR a fresh trusted-image zero-swap kernel probe.
          console.log('Linux Docker resource preflight passed; adapter must verify swap policy and actual container settings.');
          NODE
          # Image installation is an explicit trusted CI setup step, never implicit adapter execution.
          "$BOLT_C_DOCKER_PATH" --config "$RUNNER_TEMP/c-edition-docker-config" \
            --host "$BOLT_C_DOCKER_HOST" image pull "$BOLT_C_IMAGE" \
            2>&1 | tee "$RUNNER_TEMP/c-edition-evidence/image-pull.log"
          "$BOLT_C_DOCKER_PATH" --config "$RUNNER_TEMP/c-edition-docker-config" \
            --host "$BOLT_C_DOCKER_HOST" image inspect "$BOLT_C_IMAGE" \
            > "$RUNNER_TEMP/c-edition-evidence/image-inspect.json"

      - name: Run real secure C Docker integration separately
        if: matrix.platform == 'linux'
        env:
          BOLT_C_INTEGRATION: '1'
          BOLT_C_EVIDENCE: ${{ runner.temp }}/c-edition-evidence/receipts
          BOLT_C_DOCKER_PATH: /usr/bin/docker
          BOLT_C_DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          test -f desktop/tests/c-integration.cjs
          # Preserve the test's actual JSON receipts, failures, exit evidence and denials.
          # Do not substitute packaged UI smoke or mocked Docker/model output.
          node desktop/tests/c-integration.cjs \
            2>&1 | tee "$RUNNER_TEMP/c-edition-evidence/c-integration.log"
          test -s "$BOLT_C_EVIDENCE/RESULTS.json"
          test -s "$BOLT_C_EVIDENCE/audit.jsonl"
          test -s "$BOLT_C_EVIDENCE/arithmetic-assertions.json"

      - name: Package installers without publishing
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          pnpm --dir desktop exec electron-builder \
            "--${BUILD_PLATFORM}" "--${BUILD_ARCH}" --publish never

      - name: Configure packaged Linux sandbox helper
        if: matrix.platform == 'linux'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          # Only this ephemeral runner's packaged helper gets setuid ownership.
          directory=linux-unpacked
          if [ "$BUILD_ARCH" = arm64 ]; then directory=linux-arm64-unpacked; fi
          helper="$PWD/desktop/dist/$directory/chrome-sandbox"
          test -f "$helper" && test ! -L "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%U:%G:%a' "$helper")" = 'root:root:4755'

      - name: Smoke test packaged Linux UI, not C execution or real inference
        if: matrix.platform == 'linux'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          directory=linux-unpacked
          if [ "$BUILD_ARCH" = arm64 ]; then directory=linux-arm64-unpacked; fi
          export BOLT_DESKTOP_SMOKE_BINARY="$PWD/desktop/dist/$directory/bolt-cog-desktop"
          export BOLT_DESKTOP_SMOKE_OUTPUT="$RUNNER_TEMP/c-edition-evidence/ui-smoke"
          test -x "$BOLT_DESKTOP_SMOKE_BINARY"
          xvfb-run -a --server-args='-screen 0 1280x800x24' pnpm --dir desktop smoke \
            2>&1 | tee "$RUNNER_TEMP/c-edition-evidence/ui-smoke.log"

      - name: Require every C edition installer target
        env:
          EXPECTED_EXTENSIONS: ${{ matrix.extensions }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const version = require('./desktop/package.json').version;
          const prefix = `BoltCog-C-${version}-${process.env.BUILD_PLATFORM}-${process.env.BUILD_ARCH}`;
          const files = fs.readdirSync('desktop/dist', { withFileTypes: true }).filter(f => f.isFile());
          const expected = process.env.BUILD_PLATFORM === 'win'
            ? [`${prefix}-setup.exe`, `${prefix}-portable.exe`]
            : process.env.EXPECTED_EXTENSIONS.split(',').map(ext => `${prefix}.${ext}`);
          for (const name of expected) {
            assert.ok(files.some(f => f.name === name), `Missing installer: ${name}`);
            assert.ok(fs.statSync(path.join('desktop/dist', name)).size > 0, `Empty installer: ${name}`);
            console.log(`Installer: ${name}`);
          }
          NODE

      - name: Upload C installers only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BoltCog-C-${{ steps.identity.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/BoltCog-C-*.AppImage
            desktop/dist/BoltCog-C-*.deb
            desktop/dist/BoltCog-C-*.exe
            desktop/dist/BoltCog-C-*.dmg
            desktop/dist/BoltCog-C-*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Retain Linux execution and UI evidence even on failure
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c-edition-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/c-edition-evidence/
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    name: Assemble C edition draft only
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/c-desktop-v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This is the only job permitted to write release metadata/assets.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Revalidate C tag locally before any release writes
        id: identity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = require('./desktop/package.json');
          const prefix = 'c-desktop-v';
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.ok(process.env.GITHUB_REF.startsWith(`refs/tags/${prefix}`));
          assert.equal(process.env.GITHUB_REF_NAME.slice(prefix.length), pkg.version);
          assert.equal(pkg.name, 'bolt-cog-desktop');
          assert.equal(pkg.build.appId, 'org.o9nn.boltcog.c17');
          assert.equal(require('./desktop/c-edition.json').enabled, true);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Download only this run's C installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: BoltCog-C-${{ steps.identity.outputs.version }}-*
          path: downloaded
          merge-multiple: false

      - name: Require complete native targets and generate SHA256SUMS
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const version = require('./desktop/package.json').version;
          const groups = {
            'linux-x64': ['AppImage', 'deb'],
            'linux-arm64': ['AppImage', 'deb'],
            'win-x64': ['setup.exe', 'portable.exe'],
            'mac-x64': ['dmg', 'zip'],
            'mac-arm64': ['dmg', 'zip'],
          };
          fs.mkdirSync('release-assets');
          const names = new Set();
          const sums = [];
          for (const [target, extensions] of Object.entries(groups)) {
            const prefix = `BoltCog-C-${version}-${target}`;
            const expected = extensions.map(ext => `${prefix}${target.startsWith('win-') ? '-' : '.'}${ext}`);
            const dir = path.join('downloaded', prefix);
            const files = fs.readdirSync(dir, { withFileTypes: true });
            assert.equal(files.length, expected.length, `${target}: unexpected or missing installer files`);
            for (const file of files) {
              assert.ok(file.isFile() && expected.includes(file.name), `Unexpected asset: ${file.name}`);
              assert.ok(!names.has(file.name), `Duplicate asset: ${file.name}`);
              names.add(file.name);
              const source = path.join(dir, file.name);
              assert.ok(fs.statSync(source).size > 0, `Empty installer: ${file.name}`);
              fs.copyFileSync(source, path.join('release-assets', file.name));
              sums.push(`${crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex')}  ${file.name}`);
            }
          }
          fs.writeFileSync('release-assets/SHA256SUMS', sums.sort().join('\n') + '\n');
          NODE
          (cd release-assets && sha256sum --check SHA256SUMS)
          cat > release-notes.md <<'NOTES'
          Maintainer preview of Bolt Cog C, the C17-only coding edition. Installers are unsigned; macOS builds are not notarized. This is not approved production distribution.

          The real local Bolt C UI and Node backend are bundled. Configure a separately installed real OpenAI-compatible endpoint/model (or a supported direct provider). No AI engine or model weights are bundled, and this CI does not establish real model inference or code-generation quality.

          Compilation/execution requires a separately installed Docker engine running Linux containers and the exact GCC image digest in desktop/c-edition.json, explicitly pulled by the operator. The adapter fails closed if the engine, image or required memory/swap/CPU/PID/seccomp enforcement is unavailable. Generated programs are GNU/Linux binaries, including when the desktop UI is installed on Windows/macOS with Docker Desktop; they are not native Windows or macOS executables.

          Only the Linux x64/arm64 CI lanes exercise the real secure Docker C adapter, separately from packaged UI smoke. Windows/macOS lanes establish native packaging and portable tests only, not Docker execution or native GUI acceptance. The C adapter forbids host bind mounts and Docker-socket mounts, keeps container networking disabled and validates its confined resource/security policy. Docker itself remains a powerful explicitly trusted host dependency, not a guarantee against kernel/engine vulnerabilities.

          Verify downloads against SHA256SUMS and review the run's C execution/denial receipts, UI smoke and asset-ID/hash readback. Complete native install/launch acceptance, signing/notarization and a separately configured real AI-endpoint test before any manual publication. This workflow creates drafts only and never modifies an already published release. Existing desktop-v* releases remain distinct and immutable.
          NOTES

      - name: Create draft only and verify uploaded asset IDs and actual SHA256 bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Read errors are fatal, never interpreted as an absent release.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          state="$(node <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8')).flat();
          const release = releases.find(r => r.tag_name === process.env.RELEASE_TAG);
          console.log(!release ? 'absent' : release.draft ? 'draft' : 'published');
          NODE
          )"
          case "$state" in
            absent)
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Bolt Cog C ${RELEASE_TAG#c-desktop-v}" --notes-file release-notes.md
              ;;
            draft)
              # Preserve maintainer-edited notes/title on reruns.
              ;;
            *)
              echo 'Refusing to modify any already published release.' >&2
              exit 1
              ;;
          esac
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-before-upload.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const repo = process.env.GH_REPO;
          const tag = process.env.RELEASE_TAG;
          const release = JSON.parse(fs.readFileSync('release-before-upload.json', 'utf8'));
          assert.equal(release.draft, true);
          assert.equal(release.tag_name, tag);
          assert.ok(Number.isSafeInteger(release.id) && release.id > 0);
          fs.mkdirSync('release-byte-readback');
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          function gh(args, fd) {
            const result = spawnSync('gh', args, { stdio: ['ignore', fd ?? 'inherit', 'inherit'] });
            if (result.error) throw result.error;
            assert.equal(result.status, 0, `gh failed: ${args[0]}`);
          }
          const receipts = [];
          for (const name of fs.readdirSync('release-assets').sort()) {
            const local = path.join('release-assets', name);
            const existing = release.assets.find(a => a.name === name);
            if (!existing) {
              // Recheck immediately before each write; maintainers must not publish mid-run.
              const result = spawnSync('gh', ['api', `repos/${repo}/releases/${release.id}`], { encoding: 'utf8' });
              assert.equal(result.status, 0);
              assert.equal(JSON.parse(result.stdout).draft, true);
              gh(['release', 'upload', tag, local]);
            }
            // Existing draft assets are never clobbered; a content mismatch fails the rerun.
            const result = spawnSync('gh', ['api', `repos/${repo}/releases/${release.id}`], { encoding: 'utf8' });
            assert.equal(result.status, 0);
            const current = JSON.parse(result.stdout);
            assert.equal(current.draft, true);
            assert.equal(current.tag_name, tag);
            const asset = current.assets.find(a => a.name === name);
            assert.ok(asset, `Missing uploaded asset: ${name}`);
            assert.ok(Number.isSafeInteger(asset.id) && asset.id > 0, `Invalid asset ID: ${name}`);
            if (existing) assert.equal(asset.id, existing.id, `Existing draft asset was replaced: ${name}`);
            assert.equal(asset.state, 'uploaded');
            assert.equal(asset.size, fs.statSync(local).size, `Wrong asset size: ${name}`);
            const downloaded = path.join('release-byte-readback', name);
            const fd = fs.openSync(downloaded, 'wx');
            try {
              gh(['api', '-H', 'Accept: application/octet-stream', `repos/${repo}/releases/assets/${asset.id}`], fd);
            } finally { fs.closeSync(fd); }
            assert.equal(fs.statSync(downloaded).size, asset.size);
            const sha256 = hash(local);
            assert.equal(hash(downloaded), sha256, `Uploaded bytes differ: ${name}`);
            if (asset.digest) assert.equal(asset.digest, `sha256:${sha256}`);
            receipts.push({ name, id: asset.id, size: asset.size, sha256 });
            fs.writeFileSync('asset-readback.json', JSON.stringify({ tag, releaseId: release.id, draft: true, assets: receipts }, null, 2) + '\n');
            console.log(`${name}: asset ${asset.id}; sha256 ${sha256}`);
          }
          NODE
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-readback.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('release-readback.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('asset-readback.json', 'utf8'));
          assert.equal(release.draft, true, 'Release must remain a draft');
          assert.equal(release.tag_name, process.env.RELEASE_TAG);
          assert.equal(release.id, receipt.releaseId);
          for (const expected of receipt.assets) {
            const asset = release.assets.find(a => a.name === expected.name);
            assert.ok(asset);
            assert.equal(asset.id, expected.id);
            assert.equal(asset.size, expected.size);
          }
          NODE

      - name: Retain draft release readback receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c-edition-draft-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/SHA256SUMS
            asset-readback.json
            release-before-upload.json
            release-readback.json
          if-no-files-found: warn
          retention-days: 14
